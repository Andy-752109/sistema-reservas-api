# Imagen Docker de la API.
# - En cada PR: construye para linux/amd64 (la arquitectura de App Service) sin publicar.
# - A mano (workflow_dispatch) o llamado por el CD (#50): construye y publica en Docker Hub
#   con el SHA corto del commit y con latest. Dev y Prod despliegan siempre el tag del SHA.
name: Docker

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:
    outputs:
      imagen:
        description: Imagen publicada con el tag del SHA, p. ej. usuario/reservas-api:abc1234
        value: ${{ jobs.imagen.outputs.imagen }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      imagen: ${{ steps.tags.outputs.imagen }}
    steps:
      - uses: actions/checkout@v7

      - name: Calcular tags
        id: tags
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/reservas-api
          # En un PR, github.sha es el commit de merge de prueba; se usa el de la rama.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLICAR: ${{ github.event_name != 'pull_request' }}
        run: |
          corto="${SHA::7}"
          {
            echo "imagen=${REPO}:${corto}"
            echo "latest=${REPO}:latest"
            echo "publicar=${PUBLICAR}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Token de acceso de Docker Hub, nunca la contraseña.
      - name: Iniciar sesión en Docker Hub
        if: steps.tags.outputs.publicar == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir${{ github.event_name != 'pull_request' && ' y publicar' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.tags.outputs.publicar == 'true' }}
          tags: |
            ${{ steps.tags.outputs.imagen }}
            ${{ steps.tags.outputs.latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        env:
          IMAGEN: ${{ steps.tags.outputs.imagen }}
          PUBLICAR: ${{ steps.tags.outputs.publicar }}
        run: |
          if [ "$PUBLICAR" = "true" ]; then
            echo "### Imagen publicada en Docker Hub" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${IMAGEN}\` (también \`latest\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Imagen construida (PR, sin publicar)" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${IMAGEN}\` para linux/amd64" >> "$GITHUB_STEP_SUMMARY"
          fi
